<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN PAGE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" >
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="welcome">
            <h1>Welcome Back!</h1>
            <p>Provide your personal details to use all</p>
            <p id="features">features</p>
            <button type="submit">SIGN IN</button>
        </section>
        <section id="register">
            <h1 id="first-heading">Register With</h1>
            <div id="brands">
                <div class="brand"><i class="fa-brands fa-google-plus-g"></i></div>
                <div class="brand"><i class="fa-brands fa-facebook-f"></i></div>
                <div class="brand"><i class="fa-brands fa-github"></i></div>
                <div id="last"><i class="fa-brands fa-linkedin-in"></i></div>
            </div>
            <h1>OR</h1>
            <p>Fill Out The Following Info For Registration</p>
            <input type="text" placeholder="Name"><br>
            <input type="email" placeholder="Email"><br>
            <input type="password" placeholder="Password"><br>
            <button type="submit">SIGN UP</button>
        </section>
    </main>
</body>
</html>
